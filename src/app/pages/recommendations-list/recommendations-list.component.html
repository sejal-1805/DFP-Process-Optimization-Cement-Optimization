            <a
              (click)="downloadRecommendationData()"
              [hidden]="recommendationDataSource.length == 0"
            >
              <span
                class="material download material-symbols-outlined text-[30px] flex justify-end"
              >
                download
              </span>
            </a>

            <div
              class="custom-scrollbar w-full overflow-x-auto rounded-lg overflow-hidden max-h-[400px]"
            >
              <table
                class="w-full border-collapse"
                mat-table
                matSort
                (matSortChange)="sortData($event)"
                [dataSource]="dataSource"
                [hidden]="recommendationDataSource.length == 0"
              >
                <ng-container
                  [matColumnDef]="item"
                  *ngFor="let item of keysList; let i = index"
                >
                  <th
                    class="text-[14px] text-left px-4 py-1 font-semibold whitespace-nowrap border-b border-[var(--form-border)] sticky"
                    mat-header-cell
                    [mat-sort-header]="item"
                    *matHeaderCellDef
                  >
                    {{ displayedColumn[i] }}
                  </th>
                  <!-- <td mat-cell *matCellDef="let element"> 
                                    <ng-container>
                                        {{element[item]?element[item].toFixed(2):'N/A'}}
                                    </ng-container>
                                </td> -->
                  <td
                    mat-cell
                    *matCellDef="let element"
                    class="text-[13px] px-4 py-1 whitespace-nowrap text-[var(--text-color)]"
                  >
                    {{ element[item] ? element[item] : "N/A" }}
                  </td>
                </ng-container>
                <tr
                  mat-header-row
                  *matHeaderRowDef="keysList"
                  class="border-b border-[var(--form-border)] transition"
                ></tr>
                <tr
                  mat-row
                  *matRowDef="let row; columns: keysList"
                  class="border-b border-[var(--form-border)] transition"
                ></tr>
              </table>
            </div>
            <div
              class="col-sm-9 d-flex justify-content-end"
              [hidden]="recommendationDataSource.length == 0"
            >
              <mat-paginator
                [length]="100"
                [pageSize]="10"
                #paginator
                [hidden]="recommendationDataSource.length == 0"
                [pageSizeOptions]="[5, 10, 25, 100]"
                aria-label="Select page"
              >
              </mat-paginator>
            </div>
          <!-- </div> -->
          <div
            class="m-3 flex flex-col items-center justify-center py-8 px-6 text-center border border-dashed border-[var(--form-border)] rounded-xl transition-all duration-300 animate-fadeIn"
            [hidden]="recommendationDataSource.length !== 0"
          >
            <!-- Icon -->
            <div class="text-3xl mb-4 zoom-animation">🔍</div>

            <!-- Title -->
            <h2 class="text-lg font-semibold text-[var(--leftdrawer-text)] mb-2">
              No Data Found
            </h2>

            <!-- Description -->
            <p class="text-sm text-[var(--card-subtle)] mb-4">
              Try changing the filters or refresh the data
            </p>
