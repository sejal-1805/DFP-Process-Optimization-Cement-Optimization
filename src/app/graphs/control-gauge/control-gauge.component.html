            <div>
                <mat-grid-tile *ngFor="let item of datasorce;let i=index"  class="mat-grid-tile dial-card ng-star-inserted"
                    rowspan="1" colspan="1"
                    style="left: 0px; width: calc((33.3333% - 0.666667px) * 1 + 0px); margin-top: 0px; padding-top: calc((31.6667% - 0.666667px) * 1 + 0px);">

                         <mat-card
                            class="kpi-card mb-10" >
                            <mat-card-header 
                                class="mat-card-header">
                                <div class="mat-card-header-text">
                                    <mat-card-title 
                                        class="mat-card-title kpi-dial-card-title">{{item.parameterName | removebrackets}}
                                    </mat-card-title>
                                </div>
                            </mat-card-header>
                            <ngx-gauge [size]='150' type="arch" [thick]="14" [value]="item.actualValue.toFixed(2)"  [max]="item.actualValue+250" cap="round" 
                        [append]="item.unitofmeasurement" [foregroundColor]="item.foregroundColor" backgroundColor="#fff" style="width: 150px; height: 93.2571px; color: #fff;"></ngx-gauge>
                        </mat-card>
                        <!-- </a> -->
                    </div>
                </mat-grid-tile>
            </div>

<ng-template #controlsecondsDataChart>
    <div class="modal-header">
      <h4 class="modal-title pull-left">History data for {{display_name | removebrackets}} </h4>
      <button type="button" class="btn-close close pull-right" aria-label="Close" (click)="modalRef?.hide();closeModal()">
        <span aria-hidden="true" class="visually-hidden">&times;</span>
      </button>
    </div>
    <div class="modal-body">
        <div class="control-dateTime">
                <input class="datetime-modal" [owlDateTimeTrigger]="dt15" [owlDateTime]="dt15" [(ngModel)]="selectRange" class="form-control" (dateTimeChange)="onselectDateTimeRange($event)" 
                   [selectMode]="'range'" placeholder="Select Date Range" [max]="max">
                <owl-date-time #dt15></owl-date-time>
           
        </div>
        <app-loader class="d-flex justify-content-center" *ngIf="loadchart">
            <div class="d-flex justify-content-center">
                Loading
            </div>
        </app-loader>
      <app-control-line *ngIf="chartResult" [dateTimeData]="dateTimeData" [seriesData]="seriesdata" [displayName]="display_name" [unitMeasure]="unit_measure"></app-control-line>
    </div>
  </ng-template>
